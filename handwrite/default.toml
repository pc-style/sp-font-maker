[glyphs.special-characters-to-ligatures] # implemented!!
# writein-glyph-names, writein-special-characters
# Used for parsing `--other-words`.
# Used for creating the ligature used to type the custom word, AND used for the name of the custom glyph. This logic should probably be separated.
# Consider moving this to a separate file? It's inelegant here, but more robust.
# Consider switching to the official Adobe names for these special characters:
#   https://github.com/adobe-type-tools/agl-aglfn/
#   https://en.wikipedia.org/wiki/Adobe_Glyph_List

# default ASCII ligatures
"|" = "pipe"        # bar
"-" = "hyphen"      # (works combining, but not standalone)
"0" = "zero"
"1" = "one"
"2" = "two"
"3" = "three"
"4" = "four"
"5" = "five"
"6" = "six"
"7" = "seven"
"8" = "eight"
"9" = "nine"
"^" = "north"       # asciicircum
"<" = "west"        # less
">" = "east"        # greater
"[" = "bracketleft"
"]" = "bracketright"
"_" = "underscore"  # (works combining, but not standalone. not supported)

# fallback for unsupported legacy features
"+" = "plus"
"&" = "ampersand"
"{" = "opencurly"   # braceleft
"}" = "closecurly"  # braceright
"(" = "openparen"   # parenleft
")" = "closeparen"  # parenright
"*" = "asterisk"
'"' = 'doublequote' # quotedbl
"," = "comma"
"'" = "singlequote" # quotesingle

# fallback for text intended as sitelen Lasina
"!" = "exclamation" # exclam
"?" = "question"
";" = "semicolon"
